<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Engagement | A & S</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
    /* New Romantic Palette */
    --blush-pink: #ffdde1;
    --lavender: #ee9ca7;
    --soft-purple: #d4b5ff;
    --rose-gold: #f7c6a3;
    --gold-accent: #ffd700;
    --glass-white: rgba(255, 255, 255, 0.18);
}

body {
    /* Dreamy gradient background */
    background: linear-gradient(
        135deg,
        var(--blush-pink) 0%,
        var(--lavender) 40%,
        var(--soft-purple) 100%
    );
    color: #2d3436;
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    overflow: hidden;
}

/* Glass Card */
.glass-card {
    background: var(--glass-white);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 25px;
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow:
        0 10px 40px rgba(0,0,0,0.15),
        inset 0 0 25px rgba(255,255,255,0.25);
    padding: 55px 35px;
    width: 90%;
    max-width: 600px;
    text-align: center;
}

/* Names */
h1 {
    font-family: 'Playfair Display', serif;
    font-size: 3.5rem;
    margin: 0;
    color: white;
    text-shadow: 0 0 15px rgba(255,255,255,0.6);
}

/* Ring animation */
.ring-icon {
    font-size: 2.5rem;
    display: inline-block;
    animation: pulse 2s infinite;
    filter: drop-shadow(0 0 8px gold);
}

/* Quote */
h2 {
    font-weight: 300;
    font-style: italic;
    font-size: 1.3rem;
    margin: 20px 0 40px;
    color: rgba(255,255,255,0.95);
}

/* Label */
.label {
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 12px;
    color: #ffffffcc;
    font-weight: 600;
}

/* Timer Box */
#timer {
    font-size: 2.2rem;
    font-weight: 600;
    color: white;
    background: linear-gradient(
        135deg,
        rgba(255,255,255,0.25),
        rgba(255,255,255,0.05)
    );
    padding: 18px 28px;
    border-radius: 18px;
    display: inline-block;
    box-shadow:
        inset 0 2px 6px rgba(0,0,0,0.08),
        0 0 20px rgba(255,215,0,0.25);
    letter-spacing: 1px;
}

/* Pulse animation */
@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
}

/* Mobile */
@media (max-width: 600px) {
    h1 { font-size: 2.4rem; }
    #timer { font-size: 1.4rem; padding: 12px; }
    h2 { font-size: 1rem; }
}
</style>
</head>

<body>

<div class="glass-card">
    <h1>A <span class="ring-icon">💍</span> S</h1>
    <h2>"Two souls, one promise — forever begins with you."</h2>

    <div class="label">Together Since:</div>
    <div id="timer">Counting...</div>
</div>

<script>
function updateTimer() {
    const startDate = new Date('2026-02-15T22:30:00');
    const now = new Date();
    const diff = now - startDate;

    if (diff >= 0) {
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        const h = hours < 10 ? '0' + hours : hours;
        const m = minutes < 10 ? '0' + minutes : minutes;
        const s = seconds < 10 ? '0' + seconds : seconds;

        document.getElementById("timer").innerHTML =
            `<span>${days}d</span> : <span>${h}h</span> : <span>${m}m</span> : <span>${s}s</span>`;
    } else {
        document.getElementById("timer").innerHTML = "The journey begins soon!";
    }
}

setInterval(updateTimer, 1000);
updateTimer();
</script>

</body>
</html>
